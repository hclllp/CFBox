name: Obfuscate JS Without Secrets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source file exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "CFBox明文版.js" ]; then
            echo "Source file not found: CFBox明文版.js"
            exit 1
          fi
          echo "Found source file: CFBox明文版.js"

      - name: Install obfuscator
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1 || true
          npm install javascript-obfuscator

      - name: Obfuscate JS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx javascript-obfuscator \
            "CFBox明文版.js" \
            --output "CFBox混淆版_self.js" \
            --compact true \
            --self-defending true \
            --control-flow-flattening true \
            --dead-code-injection true \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 0.75 \
            --unicode-escape-sequence false \
            --simplify true \
            --shuffle true \
            --rename-globals true \
            --rename-private true

          echo "Generated output:"
          ls -l "CFBox混淆版_self.js"

      - name: Commit generated obfuscated file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "CFBox混淆版_self.js"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add obfuscated CFBox JS"
          git push
