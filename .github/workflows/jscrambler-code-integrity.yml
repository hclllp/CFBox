name: Jscrambler Code Integrity

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if this is an npm project
        id: node_project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found in this repository. Skipping npm install/build steps."
          fi

      - name: Install dependencies
        if: steps.node_project.outputs.has_package_json == 'true'
        run: npm ci

      - name: Build app
        if: steps.node_project.outputs.has_package_json == 'true'
        run: npm run build

      - name: Prepare JavaScript files for protection
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in *.js *.mjs; do
            cp "$f" dist/
          done

          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "No JavaScript source files were found to protect."
            exit 0
          fi

          echo "Prepared files for Jscrambler:"
          ls -R dist

      - name: Jscrambler Code Integrity
        if: ${{ hashFiles('jscrambler.json') != '' && hashFiles('dist/**') != '' }}
        id: jscrambler
        uses: jscrambler/code-integrity-actions/protect@ab65962a2ecffcc362b75a997e24a181d0bde5fb
        with:
          application-id: ${{ secrets.JSCRAMBLER_APPLICATION_ID }}
          secret-key: ${{ secrets.JSCRAMBLER_SECRET_KEY }}
          access-key: ${{ secrets.JSCRAMBLER_ACCESS_KEY }}
          jscrambler-config-path: jscrambler.json
          files-src: |
            dist/**/*
          files-dest: .
